[Common] # This section applies the 'MOD_' prefix to the flags so you don't have to.
NAME="FNF: GEMSTONE!"
DESCRIPTION="Hello! This mod is WIP (Work in Progress) and will be finished at some point! It's about Sapphire, finding this kid named Emerald (AKA BF). They rap battle for a while and just have alot of fun! Ruby (AKA GF) decides to tune up the beat and it goes crazy! They plan to meet up tomorrow and thats going to be it for Week 1! Week 2 will drop after but for that I will keep my plans a secret!"
AUTHOR="Team Gemstone"
VERSION="0.25"

